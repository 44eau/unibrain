<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uni Brain — Engineering Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04040c;--panel:#0d0d1c;--panel2:#13132a;--line:#23234a;--text:#e9e7ff;--mute:#9a98c4;--gold:#ffd60a;--cyan:#5ce1ff;--pink:#ff7eb6;--orange:#ffb347;--violet:#b9a8ff;--green:#7cffb2;--sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(1px 1px at 8% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 21% 64%,#dfe8ff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 37% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 52% 86%,#fff3d6 50%,transparent 51%),radial-gradient(1.3px 1.3px at 63% 9%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 74% 47%,#cfe0ff 50%,transparent 51%),radial-gradient(1.8px 1.8px at 86% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 92% 78%,#ffe6f2 50%,transparent 51%),radial-gradient(ellipse 60% 40% at 75% 10%,rgba(88,60,200,.22),transparent 70%),radial-gradient(ellipse 50% 35% at 10% 80%,rgba(200,60,140,.13),transparent 70%);
  background-size:180px 180px,230px 230px,310px 310px,270px 270px,200px 200px,350px 350px,400px 400px,260px 260px,100% 100%,100% 100%}
a{color:var(--cyan)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.sun{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2,#ffb703 45%,#ff7a00 80%);box-shadow:0 0 30px 6px rgba(255,183,3,.45)}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
nav a,.chip{font-size:13.5px;text-decoration:none;color:var(--text);padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
nav a.on,.chip.on{background:#2b2560;border-color:#6f62ff}
.search{width:100%;margin:10px 0 4px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:15px}
.card{background:linear-gradient(180deg,var(--panel),#0a0a17);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.planets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.planet{display:flex;gap:14px;align-items:center;cursor:pointer;text-decoration:none;color:inherit}
.planet:hover{border-color:#6f62ff}
.orb{flex:none;width:58px;height:58px;border-radius:50%;box-shadow:inset -10px -8px 18px rgba(0,0,0,.55),0 0 22px -2px var(--c)}
.topics{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 6px}.topics span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:#cfcdf0}
.planet h2{margin:0 0 4px;font-size:18px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.ov{border-left:3px solid var(--cyan);padding-left:12px;line-height:1.6;font-size:14.5px;color:#d8d6f5}
ol,ul{padding-left:22px;line-height:1.55;font-size:14.5px}
li{margin:3px 0}
.must li::marker{color:var(--gold);font-weight:700}.conn li::marker{color:var(--cyan);font-weight:700}.exq li::marker{color:var(--pink);font-weight:700}.weak li::marker{color:var(--orange);font-weight:700}
.l-must{color:var(--gold)}.l-conn{color:var(--cyan)}.l-exq{color:var(--pink)}.l-weak{color:var(--orange)}
.sec{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);margin:22px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
details.unit{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;margin:7px 0}
details.unit>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary b{color:var(--acc);font-weight:600}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc);white-space:nowrap}
.inner{padding:2px 16px 14px}
.pg{border-left:2px solid color-mix(in srgb,var(--acc) 35%,transparent);padding-left:12px;margin:14px 0}
.pg h3{margin:0 0 4px;font-size:15.5px;color:var(--acc)}
.pg h3 span{font-family:var(--mono);font-size:10.5px;color:var(--mute);font-weight:400;margin-left:6px}
.def{border-left:3px solid var(--violet);background:var(--panel2);padding:8px 11px;border-radius:0 9px 9px 0;font-size:14px;margin:6px 0;line-height:1.45}
.def b{color:var(--violet)}
.eq{border:1px solid #3a1d2e;background:#120b11;padding:9px 12px;border-radius:10px;margin:6px 0;overflow-x:auto}
.eq .n{font-size:12.5px;color:var(--pink);font-weight:600}
.eq .v{font-size:12px;color:var(--mute);font-family:var(--mono)}
.tip{font-size:13.5px;padding:7px 10px;background:#1a1407;border:1px solid #3d2e0b;border-radius:9px;margin:6px 0;color:#fde68a}
details.rq{margin:5px 0;font-size:13.5px}details.rq summary{cursor:pointer;color:var(--green)}details.rq div{color:var(--mute);margin:4px 0 0 16px}
.key{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.k{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.k i{width:10px;height:10px;border-radius:50%}
.ft{margin:8px 0 14px}.ft h4{margin:12px 0 6px;font-size:15px;color:var(--cyan)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.fr .nm{font-size:13.5px;font-weight:500}.fr .use,.fr .vars{font-size:12px;color:var(--mute)}
.fr .mx{overflow-x:auto}
.rk{font-family:var(--mono);font-size:11px;margin-right:4px}.r3{color:var(--gold)}.r2{color:var(--cyan)}.r1{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mute);text-align:center;padding:30px}
.foot{margin-top:40px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
.count{font-family:var(--mono);color:var(--gold)}
mjx-container{color:inherit}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px}
.qrow b{color:var(--acc);font-weight:600;font-size:14.5px}
.chip{font:inherit;font-size:13px}.chip.go{background:#6f62ff;border-color:#6f62ff;color:#fff;font-weight:600}
textarea{width:100%;margin-top:6px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0a0a17;color:var(--text);font:inherit;font-size:15px;resize:vertical}
.fb{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.5}.fb ul{margin:4px 0 0}
.fb.warn{background:#22190a;border:1px solid #5a4318}.fb.ok{background:#0e1d15;border:1px solid #1f4d33}.fb.bad{background:#1f0e0e;border:1px solid #5a2222}
.model{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:14.5px;line-height:1.55}
@media(max-width:620px){.qrow{flex-direction:column;align-items:flex-start}}
@media(max-width:620px){.fr{grid-template-columns:1fr}h1{font-size:19px}}
</style>
<script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };</script>
<script src="lib/tex-svg-full.js" defer></script>

<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="sun"></div><div><h1>Uni Brain</h1><div class="sub" id="sub">Engineering notes · view only</div></div></div>
  </header>
  <nav id="nav"></nav>
  <input class="search" id="q" placeholder="Search every unit, definition and formula…" autocomplete="off">
  <main id="main"><div class="empty">Loading the solar system…</div></main>
  <div class="foot">Summaries, formula sheets and practice questions generated from first-year engineering lecture notes with Notes Crawler.<br>View only · notes keep growing through the year.</div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let D = null, MODS = {}, FORM = { mod: 'all', ess: false };
function typeset(el) { const go = () => window.MathJax && MathJax.typesetPromise ? MathJax.typesetPromise([el]).catch(() => {}) : setTimeout(go, 300); go(); }
const thColor = i => (D.themes[i] || {}).color || '#7aa2f7';
const thName = i => (D.themes[i] || {}).name || '';
const daysTo = d => Math.ceil((new Date(d + 'T09:00:00') - Date.now()) / 864e5);
const list = (a, cls) => a && a.length ? `<ol class="${cls}">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '';
const PLANET = ['radial-gradient(circle at 32% 30%,#cfe3ff,#4b70dd 45%,#14215c 85%)', 'radial-gradient(circle at 32% 30%,#ffd9c2,#e2553d 45%,#5c160c 85%)', 'radial-gradient(circle at 32% 30%,#fff2cf,#d9a066 45%,#5a3510 85%)', 'radial-gradient(circle at 32% 30%,#d8fff6,#3fbfa8 45%,#0d4a40 85%)'];
const PCOL = ['#4b70dd', '#e2553d', '#d9a066', '#3fbfa8'];

function nav() {
  const h = location.hash.slice(1) || 'home';
  $('#nav').innerHTML = [['home', '☀️ Home'], ...D.mods.map((m, i) => ['m' + m.id, '🪐 ' + m.name]), ['quiz', '📝 Quiz'], ['formulas', '🧮 Formula sheets'], ['key', '🎨 Colour key']]
    .map(([k, t]) => `<a href="#${k}" class="${h === k ? 'on' : ''}">${esc(t)}</a>`).join('');
}
function keyHTML() {
  return `<div class="label">Unit colour = topic (same colour = related topic, even across modules)</div><div class="key">${D.themes.map(t => `<span class="k"><i style="background:${t.color}"></i>${esc(t.name)}</span>`).join('')}</div>
  <div class="label">Note colours</div><div class="key"><span class="k"><i style="background:var(--gold)"></i>★ Must know</span><span class="k"><i style="background:var(--cyan)"></i>🔗 Connections</span><span class="k"><i style="background:var(--pink)"></i>📝 Likely exam questions / equations</span><span class="k"><i style="background:var(--orange)"></i>⚠ Where marks are lost / exam tips</span><span class="k"><i style="background:var(--violet)"></i>📘 Definitions</span><span class="k"><i style="background:var(--green)"></i>❓ Test yourself</span></div>
  <div class="label">Formula ranks</div><div class="key"><span class="k"><span class="rk r3">★★★</span>essential</span><span class="k"><span class="rk r2">★★</span>often useful</span><span class="k"><span class="rk r1">★</span>reference</span></div>`;
}
const topicName = n => /^block\s*\d+$/i.test(n) ? n : n.replace(/^(w|wk|week|lec|lecture|l)\s*\d+\s*/i, '').replace(/^course introduction$/i, 'Intro').replace(/^extra notes$/i, '');
function home() {
  let units = 0, pages = 0, eqs = 0;
  D.mods.forEach(m => m.secs.forEach(s => s.units.forEach(u => { units++; pages += u.pages; u.notes.forEach(n => eqs += n.eqs.length); })));
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="label" style="margin-top:0">The system</div><div style="font-size:15px;line-height:1.6"><span class="count">${D.mods.length}</span> modules · <span class="count">${units}</span> units · <span class="count">${pages}</span> pages of lecture notes · <span class="count">${eqs}</span> equations</div></div><div class="meta">Updated ${esc(D.updated)}</div></div></div><div class="planets">`;
  D.mods.forEach((m, i) => {
    const n = m.secs.reduce((a, s) => a + s.units.length, 0), dd = m.exam ? daysTo(m.exam) : null;
    h += `<a class="card planet" href="#m${m.id}"><div class="orb" style="background:${PLANET[i % 4]};--c:${PCOL[i % 4]}"></div><div><h2>${esc(m.name)}</h2><div class="topics">${m.secs.map(s => topicName(s.name)).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('')}</div><div class="meta">${n} units${dd != null && dd >= 0 ? ` · 📅 exam in ${dd} days` : ''}</div></div></a>`;
  });
  return h + `</div><div class="card">${keyHTML()}</div>`;
}
function unitHTML(u) {
  let h = '';
  if (u.ov) h += `<div class="ov" style="margin:6px 0 10px">${esc(u.ov)}</div>`;
  if (u.must.length) h += `<div class="label l-must">★ Must know</div>${list(u.must, 'must')}`;
  if (u.conn.length) h += `<div class="label l-conn">🔗 Connections</div>${list(u.conn, 'conn')}`;
  for (const n of u.notes) {
    h += `<div class="pg"><h3>${esc(n.t)}<span>p.${n.p}</span></h3>`;
    if (n.pts.length) h += `<ul>${n.pts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    n.defs.forEach(([t, d]) => h += `<div class="def"><b>${esc(t)}</b> — ${esc(d)}</div>`);
    n.eqs.forEach(([nm, lx, v, isTex]) => h += `<div class="eq"><div class="n">${esc(nm)}</div>${isTex ? `<div>\\[${esc(lx)}\\]</div>` : `<div class="v">${esc(lx)}</div>`}${v ? `<div class="v">${esc(v)}</div>` : ''}</div>`);
    n.tips.forEach(t => h += `<div class="tip">⚠ ${esc(t)}</div>`);
    if (n.rq.length) h += n.rq.map(([q, a]) => `<details class="rq"><summary>❓ ${esc(q)}</summary><div>${esc(a)}</div></details>`).join('');
    h += `</div>`;
  }
  if (u.exq.length) h += `<div class="label l-exq">📝 Likely exam questions</div>${list(u.exq, 'exq')}`;
  return h || '<div class="meta">No notes yet.</div>';
}
function unitRow(u, open) {
  return `<details class="unit" style="--acc:${thColor(u.th)}" data-u="${u.id}" ${open ? 'open' : ''}><summary><b>${esc(u.name)}</b><span class="row" style="gap:6px;flex-wrap:nowrap">${thName(u.th) ? `<span class="tag">${esc(thName(u.th))}</span>` : ''}<span class="meta">${u.pages} pp</span></span></summary><div class="inner"></div></details>`;
}
function wireUnits(root) {
  root.querySelectorAll('details.unit').forEach(d => {
    const fill = () => { const inner = d.querySelector('.inner'); if (d.open && !inner.dataset.ok) { inner.dataset.ok = 1; inner.innerHTML = unitHTML(UNITS[d.dataset.u]); typeset(inner); } };
    d.addEventListener('toggle', fill); fill();
  });
}
function moduleView(m) {
  const r = m.rep, dd = m.exam ? daysTo(m.exam) : null;
  let h = `<div class="card"><div class="label" style="margin-top:0">Module${dd != null && dd >= 0 ? ` · 📅 exam in ${dd} days` : ''}</div><h2 style="margin:4px 0 10px">${esc(m.name)}</h2>`;
  if (r.ov) h += `<div class="ov">${esc(r.ov)}</div>`;
  if (r.must.length) h += `<div class="label l-must">★ Must know</div>${list(r.must, 'must')}`;
  if (r.conn.length) h += `<div class="label l-conn">🔗 Connections examiners like</div>${list(r.conn, 'conn')}`;
  if (r.exq.length) h += `<div class="label l-exq">📝 Likely exam questions</div>${list(r.exq, 'exq')}`;
  if (r.weak.length) h += `<div class="label l-weak">⚠ Where students lose marks</div>${list(r.weak, 'weak')}`;
  h += `</div>`;
  for (const s of m.secs) h += `<div class="sec">${esc(s.name)} · ${s.units.length} units</div>${s.units.map(u => unitRow(u)).join('')}`;
  return h;
}
function formulasView() {
  let h = `<div class="row" style="margin:8px 0"><span class="chip ${FORM.mod === 'all' ? 'on' : ''}" data-fm="all">All</span>${D.mods.map(m => `<span class="chip ${FORM.mod === m.id ? 'on' : ''}" data-fm="${m.id}">${esc(m.name)}</span>`).join('')}<label class="chip"><input type="checkbox" id="ess" ${FORM.ess ? 'checked' : ''}> Essentials only</label></div>`;
  for (const m of D.mods) {
    if (FORM.mod !== 'all' && FORM.mod !== m.id) continue;
    h += `<div class="card"><h2 style="margin:0 0 4px">${esc(m.name)}</h2>`;
    for (const s of m.sheet) {
      const tops = s.topics.map(t => ({ ...t, formulas: t.formulas.filter(f => !FORM.ess || f.rank === 3) })).filter(t => t.formulas.length);
      if (!tops.length) continue;
      h += `<div class="sec">${esc(s.name)}</div>`;
      for (const t of tops) h += `<div class="ft"><h4>${esc(t.topic)}</h4>${t.formulas.map(f => `<div class="fr"><div><div class="nm"><span class="rk r${f.rank}">${'★'.repeat(f.rank)}</span>${esc(f.name)}</div>${f.use ? `<div class="use">${esc(f.use)}</div>` : ''}</div><div><div class="mx">\\(\\displaystyle ${esc(f.latex)}\\)</div>${f.vars ? `<div class="vars">${esc(f.vars)}</div>` : ''}</div></div>`).join('')}</div>`;
    }
    h += `</div>`;
  }
  return h;
}
function searchView(q) {
  const t = q.toLowerCase(), hits = [];
  for (const m of D.mods) for (const s of m.secs) for (const u of s.units) {
    const hay = [u.name, u.ov, ...u.must, ...u.notes.flatMap(n => [n.t, ...n.pts, ...n.defs.flat(), ...n.eqs.map(e => e[0])])].join(' ').toLowerCase();
    if (hay.includes(t)) hits.push({ m, u });
  }
  if (!hits.length) return `<div class="empty">Nothing matches “${esc(q)}”.</div>`;
  return `<div class="label">${hits.length} unit${hits.length === 1 ? '' : 's'} mention “${esc(q)}”</div>` + hits.slice(0, 60).map(({ m, u }) => `<div class="meta" style="margin:10px 0 2px">${esc(m.name)}</div>${unitRow(u)}`).join('');
}
const UNITS = {};
function render() {
  nav();
  const h = location.hash.slice(1) || 'home', q = $('#q').value.trim(), main = $('#main');
  if (q.length < 2 && h === 'quiz') return renderQuizMain();
  if (q.length >= 2) main.innerHTML = searchView(q);
  else if (h === 'formulas') main.innerHTML = formulasView();
  else if (h === 'key') main.innerHTML = `<div class="card">${keyHTML()}</div>`;
  else if (h.startsWith('m') && MODS[h.slice(1)]) main.innerHTML = moduleView(MODS[h.slice(1)]);
  else main.innerHTML = home();
  wireUnits(main); typeset(main);
  main.querySelectorAll('[data-fm]').forEach(b => b.onclick = () => { FORM.mod = b.dataset.fm; render(); });
  const e = $('#ess'); if (e) e.onchange = () => { FORM.ess = e.checked; render(); };
}
let qt; $('#q').oninput = () => { clearTimeout(qt); qt = setTimeout(render, 250); };
addEventListener('hashchange', () => { QZ.queue = []; $('#q').value = ''; render(); scrollTo(0, 0); });
fetch('data.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(d => {
  D = d; D.mods.forEach(m => { MODS[m.id] = m; m.secs.forEach(s => s.units.forEach(u => (UNITS[u.id] = u))); });
  $('#sub').textContent = `Engineering notes · view only · updated ${D.updated}`;
  render();
}).catch(() => { $('#main').innerHTML = '<div class="empty">Could not load the notes.</div>'; });

/* ---------- Quiz: two attempts, works on any static host, no login ---------- */
const STOP = new Set('the a an and or of to in on at for by with from is are was were be been it its this that these those as into than then so if when which what why how does do can will would should there their they them we you your our not no but also such each per using use used about between over under more most less very just only same other both any all way ways write written compact give gives given make makes called known means thing things one two often usually simply etc'.split(' '));
const words = s => String(s || '').toLowerCase().replace(/\\[a-z]+/g, ' ').replace(/[^a-z0-9.\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));
const nums = s => (String(s || '').replace(/,/g, '').match(/-?\d+(\.\d+)?/g) || []).map(Number);
const stem = w => w.replace(/(ing|ed|es|s|ly)$/, '');
function check(user, model) {
  const key = [...new Set(words(model).filter(w => w.length >= 3 && !/^\d/.test(w)).map(stem))];
  const got = new Set(words(user).map(stem));
  const hit = key.filter(k => got.has(k)), miss = key.filter(k => !got.has(k)).sort((x, y) => y.length - x.length);
  const mn = nums(model).filter(n => n !== 0), un = nums(user);
  const numOk = !mn.length || mn.some(n => un.some(u => Math.abs(u - n) <= Math.abs(n) * 0.03 + 1e-9));
  const need = Math.min(key.length, 5), score = need ? Math.min(1, hit.length / need) : (mn.length ? 1 : 0);
  return { ok: numOk && (score >= 0.6 || (mn.length && numOk && score >= 0.3)), miss: miss.slice(0, 6), numOk, hasNum: mn.length > 0 };
}
const QS = (() => { try { return JSON.parse(localStorage.getItem('ub.quiz') || '{}'); } catch { return {}; } })();
const saveQS = () => { try { localStorage.setItem('ub.quiz', JSON.stringify(QS)); } catch {} };
function questionsOf(u) {
  const qs = [];
  for (const n of u.notes) {
    n.rq.forEach(([q, a], i) => qs.push({ id: `${u.id}|r${n.p}.${i}`, kind: 'Why / how', q, a, n }));
    n.defs.forEach(([t, d], i) => qs.push({ id: `${u.id}|d${n.p}.${i}`, kind: 'Definition', q: `Define: ${t}`, a: d, n }));
  }
  (u.xq || []).forEach(([q, a, sol, marks, src], i) => qs.push({ id: `${u.id}|x${i}`, kind: src ? '📄 ' + src : 'Exam question', q, a, sol, marks, past: !!src }));
  return qs;
}
function unitScore(u) { const qs = questionsOf(u); let done = 0, ok = 0; qs.forEach(q => { const s = QS[q.id]; if (s) { done++; if (s !== 'wrong') ok++; } }); return { total: qs.length, done, acc: done ? ok / done : null }; }
const QZ = { queue: [], i: 0, att: 1, text: '', res: null, tally: { right: 0, second: 0, wrong: 0 }, mod: null };
function startQuiz(units, onlyWrong, onlyPast) {
  let pool = units.flatMap(u => questionsOf(u).map(q => ({ ...q, u })));
  if (onlyPast) pool = pool.filter(q => q.past);
  if (onlyWrong) pool = pool.filter(q => QS[q.id] === 'wrong');
  const band = q => !QS[q.id] ? 0 : QS[q.id] === 'wrong' ? 1 : 2;
  pool.forEach(q => (q.r = Math.random())); pool.sort((a, b) => band(a) - band(b) || a.r - b.r);
  Object.assign(QZ, { queue: pool.slice(0, 40), i: 0, att: 1, text: '', res: null, tally: { right: 0, second: 0, wrong: 0 } });
  renderQuizMain(); scrollTo(0, 0);
}
function reviewOf(q) {
  const out = [];
  if (q.n) { out.push(`Re-read “${q.n.t}” (${q.u.name}, p.${q.n.p})`); q.n.pts.slice(0, 2).forEach(p => out.push(p)); }
  else { out.push(`Go back over ${q.u.name}`); (q.u.must || []).slice(0, 2).forEach(p => out.push(p)); }
  return out;
}
function record(q, o) { QS[q.id] = o; saveQS(); QZ.tally[o]++; }
function quizPicker() {
  const ms = D.mods.filter(m => !QZ.mod || QZ.mod === m.id);
  let total = 0, done = 0, h = '';
  for (const m of ms) {
    const all = m.secs.flatMap(s => s.units), nPast = all.reduce((a, u) => a + (u.xq || []).filter(x => x[4]).length, 0);
    h += `<div class="row" style="justify-content:space-between;margin:22px 0 6px"><h2 style="margin:0;font-size:18px">${esc(m.name)}</h2><span class="row" style="gap:6px">${nPast ? `<button class="chip" data-qpast="${m.id}">📄 Past papers (${nPast})</button>` : ''}<button class="chip" data-qmix="${m.id}">🎲 Mixed</button></span></div>`;
    for (const s of m.secs) {
      h += `<div class="sec">${esc(s.name)}</div>`;
      for (const u of s.units) {
        const sc = unitScore(u); total += sc.total; done += sc.done; if (!sc.total) continue;
        const wrong = questionsOf(u).filter(q => QS[q.id] === 'wrong').length;
        h += `<div class="qrow" style="--acc:${thColor(u.th)}"><div style="min-width:0"><b>${esc(u.name)}</b><div class="meta">${sc.total} questions · ${sc.done} done${sc.acc != null ? ` · <span style="color:${sc.acc >= .8 ? 'var(--green)' : sc.acc >= .5 ? 'var(--gold)' : 'var(--pink)'}">${Math.round(sc.acc * 100)}% right</span>` : ''}</div></div><span class="row" style="gap:6px;flex-wrap:nowrap">${wrong ? `<button class="chip" data-qwrong="${u.id}">Redo ${wrong} ✗</button>` : ''}<button class="chip go" data-qunit="${u.id}">Start</button></span></div>`;
      }
    }
  }
  return `<div class="card"><div class="row" style="justify-content:space-between"><div class="label" style="margin:0">📝 Quiz</div><div class="meta"><b style="color:var(--gold)">${total}</b> questions · ${done} attempted on this device</div></div>
    <div style="font-size:14px;line-height:1.55;margin-top:8px;color:#d8d6f5">Pick any unit. You get <b>two attempts</b>: miss the first and you're told what to review; miss again and you see the model answer, exactly what your answer was missing and what to revise.</div>
    <div class="row" style="margin-top:10px"><button class="chip ${!QZ.mod ? 'on' : ''}" data-qmod="">All modules</button>${D.mods.map(m => `<button class="chip ${QZ.mod === m.id ? 'on' : ''}" data-qmod="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>${h}`;
}
function quizQuestion() {
  const q = QZ.queue[QZ.i], r = QZ.res, fin = r && r.final;
  let h = `<div class="card" style="border-left:4px solid ${thColor(q.u.th)}">
    <div class="row" style="justify-content:space-between"><span class="meta">${esc(q.u.name)} · ${esc(q.kind)}</span><span class="meta">Q${QZ.i + 1}/${QZ.queue.length} · ✅${QZ.tally.right} 🟡${QZ.tally.second} ❌${QZ.tally.wrong}</span></div>
    <div style="font-size:17px;line-height:1.5;font-weight:500;margin:12px 0">${esc(q.q)}</div>`;
  if (!fin) h += `<div class="meta" style="color:${QZ.att === 2 ? 'var(--gold)' : 'var(--mute)'}">Attempt ${QZ.att} of 2</div>
    <textarea id="qa" rows="4" placeholder="Type your answer…">${esc(QZ.text)}</textarea>
    <div class="row" style="margin-top:8px"><button class="chip go" id="qcheck">Check answer</button><button class="chip" id="qidk">I don't know</button><span style="flex:1"></span><button class="chip" id="qback">Back to units</button></div>`;
  if (r && !fin) h += `<div class="fb warn">🟡 <b>Not quite — you have one more attempt.</b>${r.miss.length ? ` Your answer is missing some key ideas.` : ''}${r.hasNum && !r.numOk ? ' Check your numbers and units.' : ''}<div class="label" style="color:var(--gold)">Review this before you answer again</div><ul>${reviewOf(q).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if (fin) {
    h += r.ok ? `<div class="fb ok">✅ <b>${r.second ? 'Correct on your second attempt' : 'Correct'}</b></div>`
      : `<div class="fb bad">❌ <b>Marked wrong.</b><div class="label" style="color:var(--pink)">How you went wrong</div><div>${r.idk ? 'No answer given.' : (r.miss.length ? `Your answer didn't include: <b>${r.miss.map(esc).join(', ')}</b>.` : '') + (r.hasNum && !r.numOk ? ' Your numerical value doesn\'t match the expected answer — check the method and units.' : '') || 'Your answer didn\'t match the key points of the model answer.'}</div><div class="label" style="color:var(--pink)">Review specifically</div><ul>${reviewOf(q).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    h += `<div class="model"><div class="label">Model answer</div><div>${esc(q.a)}</div>${q.sol && q.sol.length ? `<ol>${q.sol.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}</div>
      <div class="row" style="margin-top:10px"><button class="chip go" id="qnext">${QZ.i + 1 < QZ.queue.length ? 'Next question →' : 'Finish'}</button>${r.ok ? `<button class="chip" id="qflip" data-to="wrong">Actually I got it wrong</button>` : `<button class="chip" id="qflip" data-to="${QZ.att === 2 ? 'second' : 'right'}">I was actually right</button>`}<span style="flex:1"></span><button class="chip" id="qback">Back to units</button></div>`;
  }
  return h + `</div><div class="meta" style="text-align:center">Marking checks your answer against the key ideas of the model answer — use the buttons to correct it if it misjudges you.</div>`;
}
function quizDone() {
  const t = QZ.tally, n = t.right + t.second + t.wrong;
  return `<div class="card" style="text-align:center"><div style="font-size:44px;font-weight:700;color:var(--gold)">${n ? Math.round((t.right + t.second) / n * 100) : 0}%</div><div style="margin-top:6px">✅ ${t.right} first try · 🟡 ${t.second} second try · ❌ ${t.wrong} wrong</div><div class="row" style="justify-content:center;margin-top:12px"><button class="chip go" id="qback">Back to units</button></div></div>`;
}
function renderQuizMain() {
  const main = $('#main');
  main.innerHTML = !QZ.queue.length ? quizPicker() : QZ.i >= QZ.queue.length ? quizDone() : quizQuestion();
  typeset(main);
  const on = (sel, fn) => main.querySelectorAll(sel).forEach(b => (b.onclick = () => fn(b)));
  on('[data-qmod]', b => { QZ.mod = b.dataset.qmod || null; renderQuizMain(); });
  on('[data-qunit]', b => startQuiz([UNITS[b.dataset.qunit]]));
  on('[data-qwrong]', b => startQuiz([UNITS[b.dataset.qwrong]], true));
  on('[data-qmix]', b => startQuiz(MODS[b.dataset.qmix].secs.flatMap(s => s.units)));
  on('[data-qpast]', b => startQuiz(MODS[b.dataset.qpast].secs.flatMap(s => s.units), false, true));
  on('#qback', () => { QZ.queue = []; renderQuizMain(); });
  const ta = $('#qa'); if (ta) { ta.oninput = () => (QZ.text = ta.value); }
  const q = QZ.queue[QZ.i];
  const submit = idk => {
    if (!idk && !QZ.text.trim()) { ta.focus(); return; }
    const c = idk ? { ok: false, miss: [], idk: true } : check(QZ.text, q.a + ' ' + (q.sol || []).join(' '));
    if (c.ok) { record(q, QZ.att === 1 ? 'right' : 'second'); QZ.res = { ...c, final: true, second: QZ.att === 2 }; }
    else if (QZ.att === 1 && !idk) { QZ.att = 2; QZ.res = c; }
    else { record(q, 'wrong'); QZ.res = { ...c, final: true }; }
    renderQuizMain();
  };
  on('#qcheck', () => submit(false));
  on('#qidk', () => submit(true));
  on('#qnext', () => { QZ.i++; QZ.att = 1; QZ.text = ''; QZ.res = null; renderQuizMain(); scrollTo(0, 0); });
  on('#qflip', b => { const to = b.dataset.to, from = QS[q.id]; if (from) QZ.tally[from]--; record(q, to); QZ.res = { ...QZ.res, ok: to !== 'wrong' }; renderQuizMain(); });
}

</script>
